[Ikoka_Xiao_S3_E22P]
extends = esp32_base
board = seeed_xiao_esp32s3
board_check = true
board_build.mcu = esp32s3
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/ikoka_xiao_s3_e22p
  -UENV_INCLUDE_GPS
  -D SEEED_XIAO_S3
  -D PIN_VBAT_READ=1
  -D P_LORA_DIO_1=2
  -D P_LORA_NSS=5
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=8
  -D P_LORA_MOSI=9
  -D PIN_USER_BTN=-1
  -D PIN_STATUS_LED=21
  -D PIN_BOARD_SDA=D6
  -D PIN_BOARD_SCL=D7
  -D E22P_RF_EN_PIN=6
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=19
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/ikoka_xiao_s3_e22p>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Ikoka_Xiao_S3_E22P_repeater]
extends = Ikoka_Xiao_S3_E22P
build_src_filter = ${Ikoka_Xiao_S3_E22P.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Ikoka_Xiao_S3_E22P.build_flags}
  -D ADVERT_NAME='"Ikoka XIAO Solar Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${Ikoka_Xiao_S3_E22P.lib_deps}
  ${esp32_ota.lib_deps}
